services:
  mysql:
    image: mysql:8.4
    container_name: nocfinity_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: backend
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - nocfinity_mysql_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: nocfinity_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  nocfinity_mysql_data:
